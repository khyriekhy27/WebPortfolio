<!DOCTYPE html>
<html>
<head>
<style>
body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.layout{
    display:flex;
    width:1000px;
    height:600px;
    border:1px solid black;
}

.sidebar{
    width:180px;
    background:rgb(230, 107, 7);
    padding:20px;
    color:white;
    font-weight:bold;
}

.main{
    flex:1;
    padding:20px;
}

.top{
    display:flex;
    justify-content:center;
    align-items:flex-start;
}

.box{
    width:320px;
    height:220px;
    border:2px solid rgb(253, 253, 253);
    overflow:hidden;
    background:#ffffff;
}

.box img{
    width:100%;
    height:100%;
    display:block;
    object-fit:contain;
}

.bottom{
    margin-top:20px;
    height:250px;
    border:2px solid rgb(255, 255, 255);
    overflow:hidden;
    background:#ffffff;
}

.bottom img{
    width:100%;
    height:100%;
    display:block;
    object-fit:contain;
}
</style>
</head>

<body>

<div class="layout">

    <div class="sidebar">
        Sidebar
    </div>

    <div class="main">

        <div class="top">

            <div class="box">
                <img src="spurs.jpg" alt="Left Image">
            </div>

            <div class="box">
                <img src="NYK.jpg" alt="Right Image">
            </div>

        </div>

        <div class="bottom">
            <img src="kicks.jpg" alt="Bottom Image">
            
        </div>

    </div>

</div>

</body>
</html>
